# ─────────────────────────────────────────────────────────────
# Simple, user-friendly tmux config
# ─────────────────────────────────────────────────────────────

# ── Basics ──────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Colors / status bar ─────────────────────────────────────
set -g status on
set -g status-interval 2
set -g status-justify centre
set -g status-style "fg=colour250,bg=colour235"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left  "#[fg=colour255,bg=colour237,bold] #S #[default]"
set -g status-right "#[fg=colour255,bg=colour237] %H:%M #[default]"
setw -g window-status-current-style "fg=colour231,bg=colour31,bold"

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"

# ── MOUSE: OFF so native terminal selection works ───────────
# With mouse mode ON, dragging to select text is captured by
# tmux (copy-mode) instead of your terminal, which makes
# copy/paste feel broken. Leaving it OFF gives you normal,
# predictable select-and-copy behaviour.
#
# If you ever need mouse scrolling, press Shift+scroll, or
# temporarily run:  tmux set -g mouse on
set -g mouse off

# ── Clipboard ───────────────────────────────────────────────
# Let tmux hand copied text to the system clipboard (OSC 52) and let apps
# inside tmux (e.g. nvim) set it too.
set -g set-clipboard on

# On a Wayland session use wl-copy; fall back to xclip on X11. This is the
# copy *command*, not default-command (which sets the shell for new panes).
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard -in"

# ── Copy mode (keyboard, when you need it) ─────────────────
# Prefix + [ enters copy mode. Then vi keys, y to copy.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
# Scroll wheel works inside copy mode
bind -T copy-mode-vi WheelUpPane   send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 5 scroll-down

# ── Splits: simple and memorable ────────────────────────────
# Ctrl+Arrow splits, so you never have to think about prefixes.
bind -n C-h split-window -h -c "#{pane_current_path}"
bind -n C-l split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane navigation with Alt + arrows ───────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Window navigation with Ctrl+Shift + arrows ──────────────
bind -n C-S-Up    previous-window
bind -n C-S-Down  next-window
bind -n C-S-Left  swap-window -t= -t @-1
bind -n C-S-Right swap-window -t= -t @+1

# ── Keep panes/windays alive ────────────────────────────────
set -g detach-on-destroy off
setw -g aggressive-resize on

# ── Reload config easily ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

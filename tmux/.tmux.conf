# ─────────────────────────────────────────────────────────────
# tmux config — Primeagen-style
# Prefix is C-a (rebound from the default C-b).
# ─────────────────────────────────────────────────────────────

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# ── Prefix ──────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Status bar ──────────────────────────────────────────────
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-interval 2
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Copy mode (vi keys) ─────────────────────────────────────
# y copies to the system clipboard. Wayland first (wl-copy), X11 fallback.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -in -selection clipboard'
bind -T copy-mode-vi Escape send-keys -X cancel
set -g set-clipboard on

# ── vim-like pane switching (repeatable with -r) ────────────
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── tmux-sessionizer ────────────────────────────────────────
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# ── Splits ──────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Keep panes/windows alive ────────────────────────────────
set -g detach-on-destroy off
setw -g aggressive-resize on

# ── Reload config ───────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ─────────────────────────────────────────────────────────────
# tmux config — ThePrimeagen style
# Prefix: C-a (he unbinds the default C-b)
# ─────────────────────────────────────────────────────────────

# ── Terminal ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g default-shell /usr/bin/zsh
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g allow-passthrough on
set -g set-clipboard on

# ── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Status bar ──────────────────────────────────────────────
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-interval 2
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse ───────────────────────────────────────────────────
set -g mouse on

# ── Copy mode (vi keys) ─────────────────────────────────────
# y copies to the system clipboard. Wayland first (wl-copy), X11 fallback.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -in -selection clipboard'
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Vim-like pane switching (prefix + h/j/k/l, repeatable) ──
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── Splits ──────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ── tmux-sessionizer (Primeagen's fuzzy project switcher) ───
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# ── Keep panes/windows alive ────────────────────────────────
set -g detach-on-destroy off
setw -g aggressive-resize on

# ── Reload config ───────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ── Plugins (TPM) ───────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore sessions automatically after a reboot, panes and all.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'

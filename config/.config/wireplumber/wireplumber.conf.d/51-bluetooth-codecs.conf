# Bluetooth audio: mSBC wideband speech for calls (16 kHz instead of the
# telephone-muffled 8 kHz CVSD), with AAC for A2DP music and standard SBC as
# the compatibility fallback.
#
# SBC-XQ is deliberately NOT enabled: this headset intermittently rejects its
# SET_CONFIGURATION ("Configuration not supported"), which leaves the card in
# the "off" profile and produces no audio. AAC is officially supported by the
# headset and sounds better than plain SBC; SBC remains as a guaranteed
# fallback. Re-add "ldac" here if the headset ever exposes it.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = false
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.codecs = [ aac sbc ]
  bluez5.hfphsp-backend = "native"
}

# When an app opens a microphone, switch to the headset (HFP) profile so the mic
# works, then fall back to A2DP once it closes. While a mic is held open,
# playback on that device is mono 16 kHz.
#
# Do not persist the last HFP/A2DP mode: otherwise WirePlumber restores the
# 8 kHz headset profile on boot/reconnect and music sounds "sometimes low".
# Always start in A2DP; HFP is still selected automatically when recording.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = false
}

# Re-connect A2DP automatically if WirePlumber restarts while the headset is
# already connected. Without this the card can stay in the "off" profile until
# the headset is manually disconnected/reconnected.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]

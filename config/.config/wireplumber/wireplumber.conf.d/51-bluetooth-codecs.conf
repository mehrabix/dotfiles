# Bluetooth audio: mSBC wideband speech for calls (16 kHz instead of the
# telephone-muffled 8 kHz CVSD), and hi-fi A2DP codecs preferred over plain SBC
# for music.
#
# sbc_xq outranks aac on purpose: LDAC and aptX still win when a device offers
# them, and SBC-XQ sustains well over 500 kbps where PipeWire's AAC tops out
# around 352. bluez5.codecs is a MONITOR property, so this order is global.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.codecs = [ ldac aptx_hd aptx sbc_xq aac sbc ]
  bluez5.hfphsp-backend = "native"
}

# When an app opens a microphone, switch to the headset (HFP) profile so the mic
# works, then fall back to hi-fi A2DP once it closes. While a mic is held open,
# playback on that device is mono 16 kHz.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

# hyprlock — glassy lock screen for the Ryoku-inspired rice
general {
    hide_cursor = true
    grace = 0
    fail_timeout = 2000
    text_trim = true
    screencopy_mode = 0
}

background {
    monitor =
    path = /home/ahmad/.config/background
    color = rgba(8, 10, 14, 1.0)
    blur_passes = 4
    blur_size = 10
    brightness = 0.45
    contrast = 1.05
    vibrancy = 0.30
    vibrancy_darkness = 0.35
}

# Frosted glass card
shape {
    monitor =
    size = 560, 400
    color = rgba(8, 12, 18, 0.48)
    rounding = 30
    border_size = 1
    border_color = rgba(242, 200, 121, 0.35)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = rgba(242, 200, 121, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, 118
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(230, 237, 243, 0.75)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 52
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 󰀄  $USER
    color = rgba(127, 209, 200, 0.95)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 4
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 380, 56
    outline_thickness = 2
    rounding = 28
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(242, 200, 121, 0.95)
    inner_color = rgba(10, 14, 20, 0.78)
    font_color = rgba(230, 237, 243, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##8b98a8">  Enter password…</span>
    fail_color = rgba(224, 112, 95, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(242, 200, 121, 1.0)
    position = 0, -82
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <span foreground="##8b98a8">Press Enter to unlock</span>
    color = rgba(139, 152, 168, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
    zindex = 2
}

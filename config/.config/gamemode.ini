# Feral GameMode tuning for this laptop (2-core i7-7500U + AMD R5 M445).
#
# The CPU is driven by intel_pstate in active mode through
# power-profiles-daemon: the "performance" profile sets EPP=performance and
# max_perf_pct=100 but deliberately leaves the governor at powersave (pinning
# the governor to "performance" keeps every core at 3.5 GHz, which just hits
# the 92-93 C throttle wall sooner). So GameMode must not touch the governor;
# it does the rest: renice, I/O priority, SCHED_ISO reaper thread.
[general]
renice=0
desiredgov=powersave
igpu_desiredgov=powersave
softrealtime=auto
reaper_freq=5

[gpu]
# GameMode has no AMD GPU optimisation; game-run sets the RADV/PRIME
# environment instead.
apply_gpu_optimisations=0
